name: Test and publish container

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Check formatting, dependencies and Compose
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Test with race detector and vet
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Check browser scripts and source blocklist commands
        run: |
          for script in web/static/*.js; do node --check "$script"; done
          node --test scripts/test_*.cjs
          python3 -m unittest discover -s scripts -p 'test_image_tags.py'
          python3 -m unittest discover -s scripts -p 'test_cleanup_images.py'
      - name: Test MQTT discovery against a real broker
        run: |
          mkdir -p "$RUNNER_TEMP/ros-watch-mqtt"
          printf 'listener 1883\nallow_anonymous true\npersistence false\n' > "$RUNNER_TEMP/ros-watch-mqtt/mosquitto.conf"
          docker run -d --name ros-watch-mqtt-test -p 127.0.0.1:18883:1883 \
            -v "$RUNNER_TEMP/ros-watch-mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
          trap 'docker rm -f ros-watch-mqtt-test' EXIT
          for attempt in $(seq 1 30); do
            if docker exec ros-watch-mqtt-test mosquitto_pub -h 127.0.0.1 -t probe -m ready; then break; fi
            sleep 1
          done
          ROS_WATCH_MQTT_TEST_BROKER=tcp://127.0.0.1:18883 go test -race -count=1 -run '^TestMQTTBrokerLifecycle$' .
      - name: Test container users and data migration
        run: |
          docker build --target build -t ros-watch:uidgid-build .
          docker build --target production -t ros-watch:uidgid-local .
          python3 scripts/test_container_user.py
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' config.go)
          test "$RELEASE_TAG" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' config.go)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find already published release image
        id: existing
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:$APP_VERSION" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            docker pull "$IMAGE@$digest"
            revision=$(docker image inspect "$IMAGE@$digest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$revision" = "$GITHUB_SHA"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.version=${{ env.APP_VERSION }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.APP_VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Verify exact image tags before publishing
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: sh scripts/check_image_tags.sh
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: steps.existing.outputs.digest == ''
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test published image
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          docker run -d --name ros-watch-smoke --read-only --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true --memory 192m \
            -p 127.0.0.1:18086:8080 "$IMAGE@$IMAGE_DIGEST"
          trap 'docker logs ros-watch-smoke; docker rm -fv ros-watch-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec ros-watch-smoke /ros-watch healthcheck; then break; fi
            sleep 1
          done
          docker exec ros-watch-smoke /ros-watch healthcheck
          test "$(docker exec ros-watch-smoke /ros-watch version)" = "ROS Watch $APP_VERSION (Go)"
          curl --fail --silent http://127.0.0.1:18086/setup | grep -q '创建管理员'
