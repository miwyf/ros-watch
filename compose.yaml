services:
  ros-watch:
    image: ghcr.io/miwyf/ros-watch:0.6.1
    restart: unless-stopped
    init: true
    ports:
      - "8086:8080"
      - "5514:5514/udp"
    volumes:
      - ros-watch-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 64
    stop_grace_period: 15s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  ros-watch-data:
