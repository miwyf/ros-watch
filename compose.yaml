services:
  ros-watch:
    build: .
    image: ros-watch:0.1.0
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-8086}:8080"
      - "${BIND_IP:-127.0.0.1}:${SYSLOG_PORT:-5514}:5514/udp"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env (at least 12 characters)}
      ALLOWED_SENDERS: ${ALLOWED_SENDERS:?Set the router LAN IP in .env}
      WAN_MAP: ${WAN_MAP:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      MAX_DB_MB: ${MAX_DB_MB:-512}
      MAX_ROWS: ${MAX_ROWS:-500000}
      MIN_FREE_MB: ${MIN_FREE_MB:-256}
      INGEST_PER_SECOND: ${INGEST_PER_SECOND:-500}
      SAMPLING_MODE: ${SAMPLING_MODE:-limited}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ros-watch-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 64
    stop_grace_period: 15s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  ros-watch-data:
