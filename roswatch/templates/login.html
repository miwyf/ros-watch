<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ROS Watch</title><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-page"><main class="login-card"><div class="brand"><img src="/static/icon.svg" alt="" width="40" height="40"><span>ROS<span class="muted"> WATCH</span></span></div><p class="eyebrow">YOUR NETWORK, IN SIGHT</p><h1>看清每一次外部访问</h1><p class="muted">登录你的网络观察台。</p><form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus placeholder="输入看板密码"><button class="primary" type="submit">进入看板 <span aria-hidden="true">→</span></button>{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}</form><div class="login-footer"><span class="live-dot"></span> 私有网络观察台 <span>v{{ version }}</span></div></main></body></html>
